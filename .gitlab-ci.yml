# Build and publish to Cloudflare Pages.
#
# Cloudflare's own git integration only supports GitHub and Bitbucket, so this
# does the same job for GitLab: build on push to main, then upload dist/ with
# wrangler.
#
# Required CI/CD variables (Settings → CI/CD → Variables), both masked:
#   CLOUDFLARE_API_TOKEN    token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard sidebar
#
# Create the Pages project once before the first pipeline run:
#   npx wrangler pages project create 180sx --production-branch main

image: node:24

stages:
  - build
  - deploy

# npm's cache, not node_modules — `npm ci` wipes node_modules every run anyway,
# so caching it would be thrown away.
.npm_cache: &npm_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

build:
  stage: build
  <<: *npm_cache
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  <<: *npm_cache
  needs: [build]
  # Only publish from main. Branches still build, so you find out a change is
  # broken before it's live.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://180sx.tech
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler pages deploy dist --project-name=180sx --branch=main
